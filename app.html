<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jahid Taj Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      background: #0f0f1a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 320px;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a4a;
    }
    .sidebar-header {
      padding: 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
    }
    .sidebar-header h2 {
      font-size: 1.2rem;
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-icons { display: flex; gap: 12px; }
    .icon-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
      transition: color 0.2s;
    }
    .icon-btn:hover { color: #6c63ff; }

    /* NAV TABS */
    .nav-tabs {
      display: flex;
      padding: 8px;
      gap: 4px;
      border-bottom: 1px solid #2a2a4a;
    }
    .nav-tab {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      color: #888;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .nav-tab.active { background: #6c63ff; color: #fff; }

    /* SEARCH */
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a4a;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    /* CHAT LIST */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-item:hover, .chat-item.active { background: #0f0f1a; }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-weight: 600; font-size: 0.95rem; }
    .chat-preview {
      color: #888;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-meta { text-align: right; }
    .chat-time { color: #888; font-size: 0.75rem; }
    .unread-badge {
      background: #6c63ff;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      margin-left: auto;
    }

    /* MAIN CHAT AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f0f1a;
    }
    .chat-header {
      padding: 16px 20px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar { width: 40px; height: 40px; font-size: 0.9rem; }
    .chat-header-info h3 { font-size: 1rem; }
    .chat-header-info p { color: #888; font-size: 0.8rem; }
    .chat-header-actions { margin-left: auto; display: flex; gap: 12px; }

    /* MESSAGES */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      display: flex;
      gap: 8px;
      max-width: 70%;
    }
    .message.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message .avatar { width: 32px; height: 32px; font-size: 0.75rem; flex-shrink: 0; }
    .message-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 100%;
    }
    .message.received .message-bubble {
      background: #1a1a2e;
      border-bottom-left-radius: 4px;
    }
    .message.sent .message-bubble {
      background: linear-gradient(135deg, #6c63ff, #5a52d5);
      border-bottom-right-radius: 4px;
    }
    .message-time {
      font-size: 0.7rem;
      color: #888;
      margin-top: 4px;
      text-align: right;
    }
    .message-img {
      max-width: 200px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* INPUT AREA */
    .input-area {
      padding: 16px 20px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .input-area input {
      flex: 1;
      padding: 12px 16px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 24px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.9; }

    /* WELCOME SCREEN */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888;
      gap: 16px;
    }
    .welcome h2 {
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .sidebar { width: 100%; display: none; }
      .sidebar.mobile-show { display: flex; position: absolute; z-index: 100; height: 100%; }
      .main { width: 100%; }
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 4px; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>💬 Jahid Taj</h2>
      <div class="header-icons">
        <button class="icon-btn" onclick="APP.showNewChat()" title="New Chat">✏️</button>
        <button class="icon-btn" onclick="AUTH.logout()" title="Logout">🚪</button>
      </div>
    </div>

    <div class="nav-tabs">
      <div class="nav-tab active" onclick="APP.switchTab('chats', this)">Chats</div>
      <div class="nav-tab" onclick="APP.switchTab('groups', this)">Groups</div>
      <div class="nav-tab" onclick="APP.switchTab('channels', this)">Channels</div>
      <div class="nav-tab" onclick="APP.switchTab('stories', this)">Stories</div>
    </div>

    <div class="search-box">
      <input type="text" placeholder="🔍 Search..." id="searchInput" oninput="APP.search(this.value)" />
    </div>

    <div class="chat-list" id="chatList">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main" id="main">
    <div class="welcome" id="welcome">
      <div style="font-size:4rem">💬</div>
      <h2>Jahid Taj Chat</h2>
      <p>বাম দিক থেকে একটা chat সিলেক্ট করো</p>
    </div>

    <!-- Chat View (hidden initially) -->
    <div id="chatView" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-header" id="chatHeader">
        <div class="avatar" id="chatAvatar">?</div>
        <div class="chat-header-info">
          <h3 id="chatName">-</h3>
          <p id="chatStatus">-</p>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn">📞</button>
          <button class="icon-btn">🎥</button>
          <button class="icon-btn">⋮</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <button class="icon-btn" onclick="APP.attachFile()">📎</button>
        <button class="icon-btn" onclick="APP.recordVoice()">🎤</button>
        <input type="text" id="msgInput" placeholder="Message লেখো..." onkeydown="if(event.key==='Enter') APP.sendMessage()" />
        <button class="send-btn" onclick="APP.sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
